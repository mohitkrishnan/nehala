<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nehala ❤️</title>
    <style>
        body {
            background-color: #ffeef2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 85%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            color: #d63384; 
            font-size: 1.4rem; 
            line-height: 1.6; 
            margin-bottom: 15px; 
            font-weight: 600;
        }

        .sub-text {
            color: #ff4d6d;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        .main-img {
            width: 100%;
            max-width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3); }
        #noBtn { background-color: #adb5bd; color: white; position: relative; }

        .hidden { display: none; }
        
        .final-img {
            width: 100%;
            border-radius: 20px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container" id="questionBox">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIxdmF4empxZmxoZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v4aP0v0jUz4M8/giphy.gif" class="main-img">
        
        <h1>Since we've completed our first year together, are you ready for the ride ahead, Nehala? ❤️</h1>
        <div class="sub-text">Do you love me?</div>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div class="container hidden" id="happyEnd">
        <h1>Yay! See you soon, Nehala! 🥰❤️</h1>
        <img src="couple.jpg" alt="Our Photo" class="final-img">
        <p>You've made this the best Feb 8th ever!</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('questionBox').classList.add('hidden');
            document.getElementById('happyEnd').classList.remove('hidden');
            startHearts();
        }

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-20px';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.transition = 'transform 3s linear';
                document.body.appendChild(heart);
                
                setTimeout(() => { heart.style.transform = 'translateY(110vh)'; }, 50);
                setTimeout(() => { heart.remove(); }, 3500);
            }, 200);
        }
    </script>
</body>
</html>
