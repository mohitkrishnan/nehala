<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nehala ❤️</title>
    <style>
        body {
            background: radial-gradient(circle, #ffafbd, #ffc3a0);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            text-align: center;
            overflow: hidden;
        }

        /* 1. Intro Screen */
        #introScreen {
            position: fixed;
            inset: 0;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        /* 2. Containers */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 85%;
            z-index: 10;
        }

        h1 { color: #d63384; font-size: 1.5rem; line-height: 1.5; margin-bottom: 10px; }
        .sub-text { color: #ff4d6d; font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; }
        
        .main-img {
            width: 100%;
            max-width: 220px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 100px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn { background: #ff4d6d; color: white; }
        #noBtn { background-color: #6c757d; color: white; position: relative; }

        /* Slideshow */
        .slideshow {
            position: relative;
            height: 300px;
            width: 100%;
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
        }
        .slideshow img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 1s;
        }

        .hidden { display: none !important; }

        .pulse { animation: pulseAnim 2s infinite; }
        @keyframes pulseAnim {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body>

    <div id="introScreen">
        <h2 style="font-style: italic; margin-bottom: 30px;">A special message for Nehala...</h2>
        <button class="pulse" onclick="revealProposal()" style="background: white; color: #d63384;">Open with Love</button>
    </div>

    <div class="container hidden" id="questionBox">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIxdmF4empxZmxoZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v4aP0v0jUz4M8/giphy.gif" class="main-img">
        <h1>Since we've completed our first year together, are you ready for the ride ahead, Nehala? ❤️</h1>
        <div class="sub-text">Do you love me?</div>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES!</button>
            <button id="noBtn" onmouseover="moveAndGrow()" onclick="moveAndGrow()">No</button>
        </div>
    </div>

    <div class="container hidden" id="happyEnd">
        <h1 style="font-size: 2rem;">I Knew It! 🥰❤️</h1>
        <div class="slideshow">
            <img src="couple1.jpg" id="slide1" style="opacity: 1;">
            <img src="couple2.jpg" id="slide2" style="opacity: 0;">
        </div>
        <p style="font-weight: bold; color: #d63384;">Happy Proposal Day!</p>
    </div>

    <script>
        let yesSize = 1;

        function revealProposal() {
            // Hide intro screen
            document.getElementById('introScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('introScreen').classList.add('hidden');
                // Show question box
                document.getElementById('questionBox').classList.remove('hidden');
            }, 800);
        }

        function moveAndGrow() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesSize += 0.2;
            yesBtn.style.transform = "scale(" + yesSize + ")";
        }

        function celebrate() {
            document.getElementById('questionBox').classList.add('hidden');
            document.getElementById('happyEnd').classList.remove('hidden');
            document.body.style.background = "#ff4d6d";
            
            // Start Hearts
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-20px';
                heart.style.fontSize = '25px';
                heart.style.transition = 'transform 3s linear';
                document.body.appendChild(heart);
                setTimeout(() => { heart.style.transform = 'translateY(110vh)'; }, 50);
                setTimeout(() => { heart.remove(); }, 3500);
            }, 200);

            // Start Slideshow
            const s1 = document.getElementById('slide1');
            const s2 = document.getElementById('slide2');
            setInterval(() => {
                if (s1.style.opacity === "1") {
                    s1.style.opacity = "0";
                    s2.style.opacity = "1";
                } else {
                    s1.style.opacity = "1";
                    s2.style.opacity = "0";
                }
            }, 3000);
        }
    </script>
</body>
</html>
